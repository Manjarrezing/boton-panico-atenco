services:
    - type: web
    name: boton-panico-atenco
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 -b 0.0.0.0:$PORT server:app"
    envVars:
            - key: PYTHON_VERSION
        value: 3.12.0