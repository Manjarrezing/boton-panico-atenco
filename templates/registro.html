<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro - Atenco</title><style>body{font-family:Arial;background:#0a5cad;padding:20px} .card{background:white;padding:16px;border-radius:10px;max-width:700px;margin:auto} input{width:48%;padding:10px;margin:4px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box} button{padding:12px;background:#0a5cad;color:white;border:none;border-radius:8px;width:100%;font-size:16px}</style></head>
<body><div class="card"><h2>➕ Nueva Usuaria </h2><input id="nombres" placeholder="Nombres"><input id="apellidos" placeholder="Apellidos"><input id="mac" placeholder="MAC: C30000400DE9"><input id="edad" placeholder="Edad" type="number"><input id="celular" placeholder="Celular"><input id="otro" placeholder="Otro teléfono"><input id="calle" placeholder="Calle"><input id="numero" placeholder="Número"><input id="entre_calles" placeholder="Entre calles"><input id="referencia" placeholder="Referencia"><input id="localidad" placeholder="Localidad"><input id="cp" placeholder="C.P."><input id="num_carpeta" placeholder="Número de carpeta"><input id="imputado" placeholder="Imputado"><input id="adscripcion" placeholder="Adscripcion"><input id="autoridad" placeholder="Autoridad"><input id="tipo_delito" placeholder="Tipo de delito"><input id="parentesco" placeholder="Parentesco"><input id="caracteristicas" placeholder="Caracteristicas del imputado"><label style="display:block;text-align:left;margin-top:10px;font-weight:bold">Foto de la persona:</label><input type="file" id="foto" accept="image/*"><input id="notas" placeholder="Notas"><button type="button" onclick="guardarConFoto(); return false;">Guardar Usuaria</button><p id="res"></p><a href="/dashboard">← Volver a Central</a></div>
<script>
async function guardarConFoto(){
  let fileInput = document.querySelector('input[type="file"]');
  let data = {};
  document.querySelectorAll('input, select, textarea').forEach(el=>{
    let k = el.name || el.id;
    if(!k || el.type==='file' || el.type==='submit' || el.type==='button') return;
    data[k]=el.value;
  });
  if(fileInput && fileInput.files[0]){
    let img = new Image();
    let url = URL.createObjectURL(fileInput.files[0]);
    img.onload = async ()=>{
      let canvas = document.createElement('canvas');
      let scale = Math.min(1, 800 / img.width);
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      let compressed = canvas.toDataURL('image/jpeg', 0.7);
      data.foto = compressed; data.foto_base64 = compressed; data.foto_url = compressed;
      await enviar(data);
    };
    img.src = url;
  } else { await enviar(data); }
}
async function enviar(data){
  try{
    let res = await fetch('/api/registrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    let txt = await res.text();
    let j = {};
    try{ j = JSON.parse(txt); }catch(_){ alert('Servidor dijo: '+txt.slice(0,200)); return; }
    alert('Guardado. Folio: '+(j.folio||'OK'));
    if(j.folio) window.location.href='/buscar';
  }catch(err){ alert('Error: '+err); }
}
</script>
</body></html>
